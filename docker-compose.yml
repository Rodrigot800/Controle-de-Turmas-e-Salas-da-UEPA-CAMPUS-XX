services:
  db:
    image: postgres:14-alpine
    container_name: hydrazil_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "systemhidrazil@2026"
      POSTGRES_DB: hydrazil_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./Backend/codeSQL/CreateTable.SQL:/docker-entrypoint-initdb.d/01-CreateTable.sql
      - ./Backend/codeSQL/Insert.SQL:/docker-entrypoint-initdb.d/02-Insert.sql
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
    container_name: hydrazil_backend
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: "systemhidrazil@2026"
      DB_NAME: hydrazil_db
      DB_PORT: 5432
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      AI_ALLOW_WRITES: ${AI_ALLOW_WRITES:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
    restart: unless-stopped

  # Ferramenta interativa. A rede do host permite acessar um Ollama que esteja
  # escutando somente em 127.0.0.1, sem expor sua API na rede local.
  ai:
    build:
      context: ./Backend
    network_mode: host
    environment:
      DB_HOST: 127.0.0.1
      DB_USER: postgres
      DB_PASSWORD: "systemhidrazil@2026"
      DB_NAME: hydrazil_db
      DB_PORT: ${AI_DB_PORT:-5433}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://127.0.0.1:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      AI_ALLOW_WRITES: ${AI_ALLOW_WRITES:-true}
    volumes:
      - ${AI_IMPORTS_DIR:-./Backend/imports}:/imports:ro
    stdin_open: true
    tty: true
    depends_on:
      - db
    profiles:
      - tools
    command: npm run ai

  frontend:
    build:
      context: ./Frontend
    container_name: hydrazil_frontend
    ports:
      - "443:443"
      - "3001:3001"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
    external: true
    name: controle-de-turmas-e-salas-da-uepa-campus-xx_pgdata
